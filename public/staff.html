<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fulude's Cafe | Staff Portal</title>
    <link rel="stylesheet" href="css/style.css?v=19" />
    <link rel="stylesheet" href="css/admin.css?v=16" />
    <link rel="stylesheet" href="css/staff.css?v=4" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest-staff.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fulude's Kitchen">
<meta name="theme-color" content="#000000">
    <style>
      /* First-load splash - shown only while staff.html's real assets/CSS
         finish loading, so visitors see the brand instead of a blank
         black screen. Purely additive; removes itself once ready. */
      #appSplash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transition: opacity 0.4s ease;
      }
      #appSplash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #appSplash .app-splash-logo {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 2px rgba(201, 169, 110, 0.55);
      }
      #appSplash .app-splash-name {
        font-family: "Playfair Display", serif;
        font-size: 1.35rem;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.4px;
      }
      #appSplash .app-splash-dots {
        display: flex;
        gap: 8px;
      }
      #appSplash .app-splash-dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c9a96e;
        animation: appSplashBounce 1.1s infinite ease-in-out both;
      }
      #appSplash .app-splash-dots span:nth-child(1) {
        animation-delay: -0.28s;
      }
      #appSplash .app-splash-dots span:nth-child(2) {
        animation-delay: -0.14s;
      }
      #appSplash .app-splash-dots span:nth-child(3) {
        animation-delay: 0s;
      }
      @keyframes appSplashBounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="admin-body staff-body">
    <div id="appSplash" aria-hidden="true">
      <img
        src="images/logo.jpeg"
        alt="Fulude's Cafe"
        class="app-splash-logo"
      />
      <p class="app-splash-name">Fulude's Kitchen</p>
      <div class="app-splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <!-- ===================== Login screen ===================== -->
    <div id="staffLoginScreen" class="admin-login-screen">
      <form id="staffLoginForm" class="admin-login-card">
        <h1 class="logo">Fulude's Cafe</h1>
        <p class="admin-login-sub">Staff Portal</p>
        <div class="form-group">
          <label for="staffEmail">Email</label>
          <input type="email" id="staffEmail" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="staffPassword">Password</label>
          <input
            type="password"
            id="staffPassword"
            required
            autocomplete="current-password"
          />
        </div>
        <p id="staffLoginError" class="form-error" style="display: none"></p>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
    </div>

    <!-- ===================== Kitchen board ===================== -->
    <div id="staffBoard" class="staff-board-page" style="display: none">
      <header class="staff-header">
        <div class="staff-header-brand">
          <a href="home.html" class="logo">
            <img src="images/logo2.jpeg" alt="Fulude's Cafe Logo" />
            <span class="staff-header-sub" style="font-size: 20px"
              >>Kitchen Board</span
            >
          </a>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button
            id="staffPushToggleBtn"
            class="admin-mini-btn push-toggle-btn"
          ></button>
          <button
            id="staffAlertMuteBtn"
            class="admin-mini-btn"
            title="Toggle order alerts"
          >
            <i class="fas fa-volume-up" id="staffAlertMuteIcon"></i>
          </button>
          <button id="staffLogoutBtn" class="admin-link-btn">Log Out</button>
        </div>
      </header>

      <main class="staff-board-main">
        <div class="kds-controlbar staff-controlbar" id="staffControlBar">
          <div class="kds-stat">
            <span class="kds-stat-label">Waiting</span
            ><span class="kds-stat-value" id="sWaiting">—</span>
          </div>
          <div class="kds-stat">
            <span class="kds-stat-label">Preparing</span
            ><span class="kds-stat-value" id="sPreparing">—</span>
          </div>
          <div class="kds-stat">
            <span class="kds-stat-label">Ready</span
            ><span class="kds-stat-value" id="sReady">—</span>
          </div>
          <div class="kds-stat">
            <span class="kds-stat-label">Avg Ticket Age</span
            ><span class="kds-stat-value" id="sAvgAge">—</span>
          </div>
          <div class="kds-stat">
            <span class="kds-stat-label">Longest Waiting</span
            ><span class="kds-stat-value" id="sLongest">—</span>
          </div>
          <div class="kds-stat">
            <span class="kds-stat-label">Kitchen Load</span
            ><span class="kds-stat-value" id="sLoad">—</span>
          </div>
        </div>
        <p class="kds-reset-note" id="sResetNote"></p>

        <div id="staffColumns" class="kds-board">
          <p class="menu-loading">Loading…</p>
        </div>
      </main>
    </div>

    <script src="js/pwa.js?v=17"></script>
    <script src="js/order-alert.js?v=1"></script>
    <script src="js/kds.js?v=20"></script>
    <script src="js/form-validation.js?v=1"></script>
    <script src="js/staff.js?v=21"></script>
  <script>
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
  <script>
    (function () {
      var splash = document.getElementById("appSplash");
      if (!splash) return;
      var shownAt = Date.now();
      var minVisible = 500;
      function hideSplash() {
        var wait = Math.max(0, minVisible - (Date.now() - shownAt));
        setTimeout(function () {
          splash.classList.add("is-hidden");
          setTimeout(function () {
            splash.remove();
          }, 450);
        }, wait);
      }
      if (document.readyState === "complete") {
        hideSplash();
      } else {
        window.addEventListener("load", hideSplash);
      }
    })();
  </script>
</body>
</html>
