<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fulude's Cafe | Portal</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fulude's">

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* Self-contained shared sign-in screen. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 32px 24px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background:
          radial-gradient(ellipse 70% 55% at 50% -10%, rgba(201, 169, 110, 0.18), transparent 60%),
          #0a0a0a;
        color: #fff;
      }

      .portal-brand {
        text-align: center;
      }

      .portal-brand .logo {
        font-family: "Playfair Display", serif;
        font-size: 2.4rem;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .portal-brand .sub {
        display: block;
        margin-top: 10px;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 3.5px;
        color: #c9a96e;
      }

      .portal-tiles {
        display: grid;
        grid-template-columns: repeat(3, 240px);
        gap: 20px;
      }

      .portal-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 28px 24px;
        text-decoration: none;
        color: #fff;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .portal-tile:hover,
      .portal-tile:focus-visible {
        transform: translateY(-4px);
        border-color: #c9a96e;
        background: rgba(201, 169, 110, 0.08);
        outline: none;
      }

      .portal-tile-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: rgba(201, 169, 110, 0.16);
        color: #c9a96e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
      }

      .portal-tile h2 {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .portal-tile p {
        font-size: 0.8rem;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.55);
        flex: 1;
      }

      .portal-tile .go {
        font-size: 0.76rem;
        font-weight: 600;
        color: #c9a96e;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: gap 0.18s ease;
      }

      .portal-tile:hover .go {
        gap: 11px;
      }

      .portal-note {
        font-size: 0.74rem;
        color: rgba(255, 255, 255, 0.35);
        text-align: center;
        max-width: 420px;
        line-height: 1.6;
      }

      .portal-login {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .login-emblem {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 10px;
        background: rgba(201, 169, 110, 0.16);
        color: #c9a96e;
        font-size: 1.2rem;
      }

      .portal-login h2 {
        margin-bottom: 8px;
        font-size: 1.35rem;
      }

      .portal-login > p {
        margin-bottom: 22px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 0.88rem;
      }

      .portal-login label {
        display: block;
        margin: 16px 0 7px;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .portal-login input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        outline: none;
        background: rgba(0, 0, 0, 0.28);
        color: #fff;
        font: inherit;
      }

      .portal-login input:focus {
        border-color: #c9a96e;
        box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.14);
      }

      .portal-login button[type="submit"] {
        width: 100%;
        min-height: 46px;
        margin-top: 22px;
        border: 0;
        border-radius: 6px;
        background: #c9a96e;
        color: #17130c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .portal-login button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .portal-login-error {
        display: none;
        margin-top: 14px;
        padding: 11px 12px;
        border-left: 3px solid #e36b64;
        background: rgba(227, 107, 100, 0.12);
        color: #ffd5d1;
        font-size: 0.84rem;
        line-height: 1.5;
      }

      .portal-login-error.is-locked::before {
        content: "\f47a  ";
        font-family: "bootstrap-icons";
      }

      .portal-login-link {
        display: block;
        margin-top: 16px;
        border: 0;
        background: none;
        color: #d4bd92;
        font: inherit;
        font-size: 0.82rem;
        text-align: center;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      .portal-login-link:hover {
        color: #fff;
      }

      @media (max-width: 860px) {
        .portal-tiles {
          grid-template-columns: minmax(0, 340px);
        }

        body {
          gap: 28px;
        }
      }
    </style>
  </head>
  <body>
    <script>window.location.replace("/home");</script>
    <noscript><a href="/home">Continue to Fulude's Cafe</a></noscript>
</body>
</html>
